<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الشامل 12</title>
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
      }
      /* Ensure KaTeX math is always LTR and styled like a book */
      .katex {
        direction: ltr !important;
        unicode-bidi: isolate;
        font-size: 1.15em; /* Balanced with text */
      }
      .katex-display {
        direction: ltr !important;
        text-align: center;
        margin: 1.5rem 0;
        padding: 0.5rem 0;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      .katex-display::-webkit-scrollbar {
        display: none;
      }
      .math-block-container {
        width: 100%;
        display: flex;
        justify-content: center;
        margin: 1rem 0;
      }
      .math-block-container .katex-display > .katex {
        white-space: nowrap;
        font-size: 1.25em;
      }
      .math-inline {
        display: inline-block;
        direction: ltr !important;
        margin: 0 0.4rem;
        vertical-align: middle;
      }
      .math-inline .katex {
        font-size: 1.1em;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
